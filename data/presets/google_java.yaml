style_profile:
  id: "00000003"
  name: "Google Java Style"
  language: "java"
  version: "1.0"
  created_at: "2025-01-01T00:00:00Z"
  source: "preset"
  rules:
    naming:
      variables: "camelCase"
      functions: "camelCase"
      classes: "PascalCase"
      constants: "UPPER_SNAKE"
      private_prefix: ""
      member_prefix: ""
    indent:
      style: "space"
      size: 2
    brace_style:
      style: "k_and_r"
      space_before_paren: true
    spacing:
      space_around_operators: true
      space_after_comma: true
      trim_trailing_whitespace: true
    blank_lines:
      max_consecutive: 1
      between_functions: 1
      after_imports: 1
    comments:
      inline_min_spaces: 2
      docstring_format: "none"
    declarations:
      cpp_const_style: "east"
      python_type_hints: false
  meta: {}
